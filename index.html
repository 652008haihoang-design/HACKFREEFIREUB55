<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Vinh - Trang Cá Nhân</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background-color: #1e1e1e;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
        }
        h1 {
            color: #ff4500;
            font-size: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 15px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-buy {
            background-color: #ff4500;
            color: #fff;
        }
        .btn-buy:hover {
            background-color: #e03e00;
        }
        .btn-fb {
            background-color: #1877f2;
            color: #fff;
        }
        .btn-fb:hover {
            background-color: #1464cc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>TRẦN VINH UY TÍN</h1>
        <p>Chào mừng bạn đến với trang cá nhân chính thức.</p>

        <!-- Nút MUA NGAY -->
        <a href="#" class="btn btn-buy">MUA NGAY</a>

        <!-- Nút Kết Bạn Facebook -->
        <a href="https://www.facebook.com/share/1HWagkGfdV/?mibextid=wwXIfr" target="_blank" class="btn btn-fb">ẤN VÀO ĐÂY ĐỂ KẾT BẠN</a>
    </div>

</body>
</html>
